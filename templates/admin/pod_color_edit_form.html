<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Редактировать цвет POD</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a1a; color: white; padding: 20px; }
        .form-container { max-width: 600px; margin: 0 auto; background: #2a2a2a; padding: 30px; border-radius: 10px; }
        h1 { color: #D32F2F; margin-bottom: 10px; text-align: center; }
        .device-info { text-align: center; color: #aaa; margin-bottom: 20px; padding: 10px; background: #333; border-radius: 5px; }
        .device-info strong { color: #fff; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #ccc; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid #444; border-radius: 5px; background: #333; color: white; font-size: 14px; }
        input:focus { outline: none; border-color: #D32F2F; }
        .buttons { display: flex; gap: 10px; margin-top: 20px; }
        button, .cancel-btn { flex: 1; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; text-decoration: none; text-align: center; font-size: 14px; }
        button { background: #4CAF50; color: white; }
        .cancel-btn { background: #666; color: white; }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Редактировать цвет</h1>
        <div class="device-info">Устройство: <strong>{{ device.device }}</strong></div>

        <form method="POST">
            <div class="form-group">
                <label>Название цвета *</label>
                <input type="text" name="color" value="{{ color.color }}" required>
            </div>
            <div class="form-group">
                <label>Количество (шт) *</label>
                <input type="number" name="quantity" value="{{ color.quantity }}" min="0" required>
            </div>
            <div class="form-group">
                <label>Цена (₽) *</label>
                <input type="number" name="price" value="{{ color.price }}" min="0" required>
            </div>
            <div class="buttons">
                <button type="submit"> Сохранить</button>
                <a href="{{ url_for('admin_dashboard') }}" class="cancel-btn">Отмена</a>
            </div>
        </form>
    </div>
</body>
</html>
